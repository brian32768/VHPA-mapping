<!DOCTYPE html>
<html lang="en">
<head>
  <title>Vietnam Helicopter Crashes</title>

  <link rel="stylesheet" href="index.css" />
  <script type="module" src="maps.js"></script>
</head>

<body>

  <div id="leftbar">
    <div id="logo">
      <center>
        <a href="https://vhpa.org/"><img width="94" height="75" src="vhpalogo.gif"></a>
      </center>
    </div>
    <div id="overviewmap" class="map"></div>
    <div id="province_data">
      <h2>PROVINCE</h2>
      <h3>COUNTRY</h3>
      crash sites: <b>000</b>
    </div>
  </div>

  <div id="main">
    <div id="titlebar">
      <center>
        <h1>Vietnam Helicopter Crash Sites</h1>
      </center>
      <div id="coords" style="position:absolute;left:5px;bottom:10px;">position</div>
      <div id="map_controls">
        <div class="slider" id="opacity_slider">
          <span id="min2" class="slider-text"></span>
          <span id="max2" class="slider-text"></span>
        </div>
      </div>
    </div>

    <div id="modal" class="modal-overlay"/>
    <div id="modal-box">
      <button class="close-btn" onclick="closeModalBtn()" aria-label="Close">CLOSE</button>
      <h2>a picture</h2>
      descriptive text will go here
      <img id="modal-img" style="max-width:90vw;max-height:90vh;">
    </div>
    </div>
    
    <div id="detailmap" class="map">
      <div id="info"></div>
    </div>

    <div id="crash_data">
      <div id="crash_text">
        <h3>Click on a crash site on the map to see information here</h3>
      </div>

      <div id="plot-control">
        <div class="slider" id="date_slider"></div>
        <div id="plot"><img width="180" height="180" src="chart.png"></div>
      </div>

      <div id="crash_picture">picture</div>

    </div>
  </div>

  <script>
    function closeModalBtn() {
      document.getElementById('modal').classList.remove('active');
    }
  </script>
</body>
</html>
