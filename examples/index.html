<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Load CSV data</title>

    <link rel="stylesheet" href="./node_modules/ol/ol.css">
    <style>
      .map {
        width: 640px;
        height: 400px;
      }
      #map {
        position: relative;
      }

      #info {
        position: absolute;
        display: inline-block;
        height: auto;
        width: auto;
        z-index: 100;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 4px;
        padding: 5px;
        left: 50%;
        transform: translateX(3%);
        visibility: hidden;
        pointer-events: none;
      }
      .ol-layer-switcher {
        background: white;
        padding: 0.5em;
        border-radius: 8px;
        font-size: 14px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        margin: 8px;
        min-width: 110px;
      }
  </style>  
    <link rel="stylesheet" href="scss/styles.scss">
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div class="container text-center">
      <div class="row">
        <div class="col">
          <div id="overviewmap" class="map">
            overview
          </div>
        </div>
        <div class="col-6">
          <div id="map" class="map">
            <div id="info"></div>
          </div>
        </div>
        <div class="col">
          <button class="btn btn-primary">Primary button</button>
        </div>
      </div>
  
      <div class="row">
        <div class="col">
          <h2>T1</h2>
          <div id="t1">t1 table</div>
      </div>
        <div class="col">
          <h2>T2</h2>
          <div id="t2">t2 table</div>
        </div>
      </div>
    </div>


  </body>
</html>
